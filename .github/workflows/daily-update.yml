name: Ежедневное обновление фида

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Regenerate feed.xml
        run: python3 generate_feed.py

      - name: Commit and push if changed
        run: |
          git config user.name "avito-feed-bot"
          git config user.email "actions@github.com"
          git add feed.xml
          git diff --cached --quiet && echo "no changes" || (git commit -m "Ежедневное обновление фида" && git push)
